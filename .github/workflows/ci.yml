name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,app,yaml]"
      - run: pytest --cov=leaklens --cov-report=term-missing -q
      # POSIX-only boundary tests (symlinks, FIFOs, the filesystem root) are
      # skipped on Windows. Run them verbosely on Linux so the job log proves
      # they executed instead of silently skipping.
      - name: POSIX path-security tests
        if: matrix.python == '3.12'
        run: >-
          pytest -v -rs
          tests/test_paths.py tests/test_baseline.py
          tests/test_scanner.py tests/test_workspace.py
          -k "symlink or fifo or nul or regular_file or filesystem_root"
      - run: leaklens --scan leaklens
      - run: python -m leaklens.bench
      - run: python -m leaklens.bench_data
      - run: python -m leaklens.bench_missing
      - run: python -m leaklens.bench_drift
      - run: python -m leaklens.bench_pipeline
      - run: python -m leaklens.bench_text
      - run: python -m leaklens.bench_dl
      - run: python -m leaklens.bench_ai
      - run: python -m leaklens.bench_realworld --no-profile
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # A wheel can silently omit modules and still look installable; build
      # both distributions and prove them complete against this checkout.
      - run: pip install build
      - run: python -m build
      - run: python scripts/validate_release.py --wheel dist/*.whl
      - run: python scripts/validate_release.py --sdist dist/*.tar.gz
      - run: pip install dist/*.whl
      # Run from a neutral directory so the checkout cannot shadow the wheel.
      - run: python -m leaklens --version
        working-directory: ${{ runner.temp }}
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # SQLGlot is optional: the default matrix must stay green without it,
      # so the SQL tests and benchmark get their own extra-enabled job.
      - run: pip install -e ".[dev,app,sql]"
      - run: pytest tests/test_sqlscan.py tests/test_wave3_integration.py -q
      - run: python -m leaklens.bench_sql
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # Build isolation (PEP 517) only upgrades the build env. The runtime
      # setuptools shipped with setup-python is audited by pip-audit, so
      # upgrade it explicitly before the audit.
      - run: pip install --upgrade "setuptools>=84.1.0"
      - run: pip install -e ".[dev]"
      - run: bandit -r leaklens
      - run: pip show setuptools
      - run: pip-audit --desc
      - run: pip-licenses --format=csv
      - run: python -m leaklens --version
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.17"
      - run: ruff check leaklens tests scripts
      - run: ruff format --check leaklens tests scripts
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,api]"
      # Upload hardening, contract and real-HTTP smoke checks for the public
      # live-scan API. No deployed backend is required.
      - run: pytest tests/test_public_api.py tests/test_upload_guard.py -q
      - run: python scripts/smoke_public_api.py
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: pip install -e .
      # Fails when the recorded demo fixtures drift from the real scanners,
      # a link or asset is missing, or the static pages lose an a11y landmark.
      - run: python scripts/build_site.py --check
      - run: node --test tests/site/demo-engine.test.mjs tests/site/live-engine.test.mjs
