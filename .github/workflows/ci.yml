name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,app]"
      - run: pytest --cov=leaklens --cov-report=term-missing -q
      - run: leaklens --scan leaklens
      - run: python -m leaklens.bench
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Build isolation (PEP 517) only upgrades the build env. The runtime
      # setuptools shipped with setup-python is audited by pip-audit, so
      # upgrade it explicitly before the audit.
      - run: pip install --upgrade "setuptools>=84.1.0"
      - run: pip install -e ".[dev]"
      - run: bandit -r leaklens
      - run: pip-audit
