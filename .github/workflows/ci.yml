name: CI
on:
  push:
    branches: [main]
  pull_request:
# Every job only reads the repository. Declaring it here keeps the token
# read-only even if the repository default is ever widened.
permissions:
  contents: read
# Superseded pull-request runs are worthless; cancel them. Push runs on main
# are never cancelled, because a release may depend on that result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,app,yaml]"
      - run: pytest --cov=leaklens --cov-report=term-missing -q
      # POSIX-only boundary tests (symlinks, FIFOs, the filesystem root) are
      # skipped on Windows. Run them verbosely on Linux so the job log proves
      # they executed instead of silently skipping.
      - name: POSIX path-security tests
        if: matrix.python == '3.12'
        run: >-
          pytest -v -rs
          tests/test_paths.py tests/test_baseline.py
          tests/test_scanner.py tests/test_workspace.py
          -k "symlink or fifo or nul or regular_file or filesystem_root"
      # M-S6: validate the versioned corpus, pinned digests and containment
      # thresholds offline. No model, network call or API key is involved.
      - name: Prompt-injection corpus validation
        if: matrix.python == '3.12'
        run: python -m leaklens.ai.prompt_injection --check
      - run: leaklens --scan leaklens
      - run: python -m leaklens.bench
      - run: python -m leaklens.bench_data
      - run: python -m leaklens.bench_missing
      - run: python -m leaklens.bench_drift
      - run: python -m leaklens.bench_pipeline
      - run: python -m leaklens.bench_text
      - run: python -m leaklens.bench_dl
      - run: python -m leaklens.bench_vision
      - run: python -m leaklens.bench_ai
      - run: python -m leaklens.bench_investigation
      - run: python -m leaklens.bench_realworld --no-profile
  spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # The codespell hook config (.pre-commit-config.yaml) is the single
      # source of truth; the action runs every hook, which today is codespell.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python scripts/validate_release.py --versions
      # A wheel can silently omit modules and still look installable; build
      # both distributions and prove them complete against this checkout.
      - run: pip install build
      - run: python -m build
      - run: python scripts/validate_release.py --wheel dist/*.whl
      - run: python scripts/validate_release.py --sdist dist/*.tar.gz
      # An sdist that cannot rebuild the same wheel is broken for anyone
      # installing from source; prove it here instead of at publish time.
      - name: Rebuild the wheel from the sdist
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/from-sdist" dist/*.tar.gz
          python scripts/validate_release.py --wheel "$RUNNER_TEMP"/from-sdist/*.whl
      - run: pip install dist/*.whl
      # Run from a neutral directory so the checkout cannot shadow the wheel.
      - run: python -m leaklens --version
        working-directory: ${{ runner.temp }}
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # SQLGlot is optional: the default matrix must stay green without it,
      # so the SQL tests and benchmark get their own extra-enabled job.
      - run: pip install -e ".[dev,app,sql]"
      - run: pytest tests/test_sqlscan.py tests/test_wave3_integration.py -q
      - run: python -m leaklens.bench_sql
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # Build isolation (PEP 517) only upgrades the build env. The runtime
      # setuptools shipped with setup-python is audited by pip-audit, so
      # upgrade it explicitly before the audit.
      - run: pip install --upgrade "setuptools>=84.1.0"
      - run: pip install -e ".[dev]"
      - run: bandit -r leaklens
      - run: pip show setuptools
      - run: pip-audit --desc
      - run: pip-licenses --format=csv
      - run: python -m leaklens --version
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.17"
      - run: ruff check leaklens tests scripts
      - run: ruff format --check leaklens tests scripts
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,api]"
      # Upload hardening, contract and real-HTTP smoke checks for the public
      # live-scan API. No deployed backend is required.
      - run: pytest tests/test_public_api.py tests/test_upload_guard.py -q
      - run: python scripts/smoke_public_api.py
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: pip install -e .
      # Fails when the recorded demo fixtures drift from the real scanners,
      # a link or asset is missing, or the static pages lose an a11y landmark.
      - run: python scripts/build_site.py --check
      - run: node --test tests/site/demo-engine.test.mjs tests/site/live-engine.test.mjs
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Build only: the runner never publishes or pushes an image.
      - name: Build the default image
        run: docker build --tag leaklens:ci .
      - name: Verify the runtime user and healthcheck
        run: |
          user="$(docker image inspect leaklens:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "root"
          test "$user" != "0"
          health="$(docker image inspect leaklens:ci --format '{{json .Config.Healthcheck}}')"
          test "$health" != "null"
      - name: Smoke test the health endpoint
        run: |
          docker run --detach --name leaklens-ci --publish 8000:8000 leaklens:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs leaklens-ci
          exit 1
