<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">LeakLens: data leakage audits for machine-learning pipelines</title>
  <desc id="banner-desc">A dark banner with the LeakLens lens mark and wordmark. On the right, a lens inspects a data, split and code pipeline and flags one node.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df0dd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1520"/>
      <stop offset="1" stop-color="#08101a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2c3f" stroke-width="1" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#surface)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="17" fill="none" stroke="#1b2c3f"/>

  <g>
    <circle cx="86" cy="102" r="30" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="86" cy="102" r="9" fill="#5eead4"/>
    <path d="M108 124l22 22" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="122" cy="66" r="14" fill="none" stroke="#ff7f7f" stroke-width="2" opacity=".35"/>
    <circle cx="122" cy="66" r="6" fill="#ff7f7f"/>
  </g>

  <text x="152" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#e9f1f9">LeakLens</text>
  <text x="154" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9aadc2">Find leakage before it inflates your metrics.</text>
  <text x="154" y="196" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="1.8" fill="#5eead4">OFFLINE · DETERMINISTIC · NO CODE EXECUTION</text>

  <path d="M660 42v196" stroke="#1b2c3f" stroke-width="1"/>

  <text x="712" y="86" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2" fill="#7d92a9">AUDIT FLOW</text>

  <path d="M742 150h392" stroke="#1b2c3f" stroke-width="2"/>
  <circle cx="768" cy="150" r="9" fill="#0c1520" stroke="#5eead4" stroke-width="3"/>
  <circle cx="948" cy="150" r="9" fill="#0c1520" stroke="#8ab4ff" stroke-width="3"/>
  <circle cx="1128" cy="150" r="9" fill="#0c1520" stroke="#ff7f7f" stroke-width="3"/>
  <circle cx="1128" cy="150" r="22" fill="none" stroke="#ff7f7f" stroke-width="1.5" opacity=".4"/>

  <circle cx="948" cy="150" r="58" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <path d="M989 191l18 18" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="948" cy="150" r="7" fill="#5eead4"/>

  <text x="768" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9aadc2" text-anchor="middle">data</text>
  <text x="948" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9aadc2" text-anchor="middle">split</text>
  <text x="1128" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9aadc2" text-anchor="middle">code</text>

  <text x="712" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7d92a9">findings · evidence · trust score · exit code</text>
</svg>
