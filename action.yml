name: LeakLens
description: Scan notebooks and scripts for ML data leakage (fit before split, SMOTE before split, fit on test data)
branding:
  icon: search
  color: blue
inputs:
  path:
    description: File or folder to scan
    default: "."
  fail-under:
    description: Optional minimum trust score (0-100); fail when the scan scores below it
    required: false
  baseline:
    description: Optional path to a LeakLens baseline file; findings are labelled new/unchanged/changed/resolved
    required: false
  fail-on-new:
    description: Optional; fail when a finding is new relative to the baseline (requires baseline)
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"
    - run: pip install "${{ github.action_path }}"
      shell: bash
    - run: |
        args=()
        if [[ -n "$LEAKLENS_FAIL_UNDER" ]]; then
          args+=(--fail-under "$LEAKLENS_FAIL_UNDER")
        fi
        if [[ -n "$LEAKLENS_BASELINE" ]]; then
          args+=(--baseline "$LEAKLENS_BASELINE")
        fi
        if [[ "$LEAKLENS_FAIL_ON_NEW" == "true" ]]; then
          args+=(--fail-on-new)
        fi
        leaklens --scan "$INPUT_PATH" "${args[@]}"
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        LEAKLENS_FAIL_UNDER: ${{ inputs.fail-under }}
        LEAKLENS_BASELINE: ${{ inputs.baseline }}
        LEAKLENS_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
