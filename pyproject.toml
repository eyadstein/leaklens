[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens-ml"
version = "0.11.0"
description = "Audit datasets and ML pipelines for data leakage"
readme = "README.md"
license = "MIT"
authors = [{name = "Eyad"}]
keywords = ["data-leakage", "machine-learning", "mlops", "data-science", "scikit-learn", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",

  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/eyadstein/leaklens"
Issues = "https://github.com/eyadstein/leaklens/issues"

[project.optional-dependencies]
arena = ["mlflow>=2.9"]
parquet = ["pyarrow>=14"]
feather = ["pyarrow>=14"]
excel = ["openpyxl>=3.1"]
app = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "streamlit>=1.30"]
dev = ["pytest>=7", "pytest-cov>=4", "mlflow>=2.9", "fastapi>=0.110", "httpx>=0.26", "python-multipart>=0.0.9", "pyarrow>=14", "openpyxl>=3.1"]

[project.scripts]
leaklens = "leaklens.cli:main"

[tool.setuptools.packages.find]
include = ["leaklens*"]
