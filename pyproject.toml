[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens-ml"
version = "0.12.0"
description = "Audit datasets and ML pipelines for data leakage"
readme = "README.md"
license = "MIT"
authors = [{name = "Eyad"}]
keywords = ["data-leakage", "machine-learning", "mlops", "data-science", "scikit-learn", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",

  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/eyadstein/leaklens"
Issues = "https://github.com/eyadstein/leaklens/issues"

[project.optional-dependencies]
arena = ["mlflow>=2.9"]
parquet = ["pyarrow>=14"]
feather = ["pyarrow>=14"]
excel = ["openpyxl>=3.1"]
images = ["pillow>=9.1"]
app = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "streamlit>=1.30"]
taintwatch = ["taintwatch>=0.1.0,<0.2"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "mlflow>=2.9",
    "fastapi>=0.110",
    "httpx>=0.26",
    "python-multipart>=0.0.9",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "pillow>=9.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
leaklens = "leaklens.cli:main"

[tool.setuptools.packages.find]
include = ["leaklens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "_darcs", "build", "dist", "CVS", "maintenance-backup", ".venv"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", ".venv", "maintenance-backup"]
# B101 (assert_used) is a testing idiom; skip in tests via exclude_dirs above.
skips = ["B101"]

[tool.ruff.lint]
extend-select = ["B02", "BLE0", "F4", "I00", "ISC0", "PLW15", "RUF0", "S10"]
ignore = ["ISC004", "RUF100", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101", "S103", "S603", "S607"]
