# Runs the same codespell invocation as CI (see ci.yml): the pre-commit hook
# and the CI job share this config, so a local run matches the gate.
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # realworld/notebooks is a corpus of third-party notebooks kept
        # verbatim as fixtures; the expansion manifest and review queue record
        # third-party paths and repository names verbatim, so both are skipped
        # too. Everything else is spell-checked.
        args: ["--skip=realworld/*,*manifest.jsonl,*review_queue.jsonl", "--ignore-words-list=te,strat,fpr,FPR,unparseable,disjointness,Disjointness,re-used,nd"]
