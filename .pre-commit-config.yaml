# Runs the same codespell invocation as CI (see ci.yml): the pre-commit hook
# and the CI job share this config, so a local run matches the gate.
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # realworld/notebooks is a corpus of third-party notebooks kept
        # verbatim as fixtures; the expansion manifest and review queue record
        # third-party paths and repository names verbatim, so both are skipped
        # too, as are the frozen case-set snapshots, which repeat those paths.
        # Everything else is spell-checked. DOIs are exempt because a
        # real one can contain a word codespell misreads (10.1016/j.patter...).
        args: ["--skip=realworld/*,*manifest.jsonl,*review_queue.jsonl,*freezes/*.json", "--ignore-words-list=te,strat,fpr,FPR,unparseable,disjointness,Disjointness,re-used,nd", "--ignore-regex=10\\.[0-9]{4,9}/\\S+"]
